name: Build release binaries

# Builds standalone binaries for Linux, macOS and Windows and attaches them to
# the release. A push to main (or a manual run) refreshes the v2.0.0 release;
# pushing a v* tag attaches the binaries to that tag's release instead.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}

jobs:
  test:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Tk system libraries
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Verify Tkinter is available
        run: python -c "import tkinter, customtkinter; print('Tk', tkinter.TkVersion)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Install Tk system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Verify Tkinter is available
        run: python -c "import tkinter, customtkinter; print('Tk', tkinter.TkVersion)"

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon icon.ico \
            --collect-all customtkinter --name course_downloader course_downloader.py
          ./dist/course_downloader --help
          mkdir -p release-assets
          cp dist/course_downloader release-assets/course_downloader-linux-x86_64

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon icon.ico \
            --collect-all customtkinter --name course_downloader course_downloader.py
          mkdir -p release-assets
          cp dist/course_downloader.exe release-assets/course_downloader.exe

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon icon.icns \
            --collect-all customtkinter --name course_downloader course_downloader.py
          mkdir -p release-assets
          if [ -d dist/course_downloader.app ]; then
            (cd dist && zip -ry ../release-assets/course_downloader-macos-arm64.zip course_downloader.app)
          else
            (cd dist && zip -r ../release-assets/course_downloader-macos-arm64.zip course_downloader)
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-binary
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Show staged assets
        run: ls -la release-assets
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
          fi
